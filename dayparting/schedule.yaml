# 时段预算规则 —— 和 baseline.yaml / execution_ledger.json 完全独立，
# 只被 dayparting/apply_schedule.py 读取。改这个文件不影响 run.py suggest/execute。
#
# 窗口字段：
#   名称     可选，账本里区分同产品多条窗口用
#   产品码   baseline.yaml 的产品码（campaign 名第一段，大小写不敏感）
#   星期     ISO 星期数组：1=周一 … 7=周日
#   开始/结束 本地时钟时间 "HH:MM"，允许跨午夜（如 21:00 → 08:00 表示次日还原）
#   预算倍率  窗口内把预算打到"原预算 × 本值"；离开窗口自动还原到原值
#
# 这是试验用的第一条规则：产品 103，过去60天数据里周六(45.9% ACOS)/周日(48.3%)
# 持续明显高于平时(~25-31%)，且不是已知的"测试产品"或"断货中"产品（263/W319 是
# 内定测试产品，NW017/NW007 正在断码，两者的高ACOS另有原因，不适合用来验证
# 时段假设——见 dayparting/reports/ 下的分析报告）。
#
# 没有小时级数据能证实"21点之后才变差"，这里的 21:00 是沿用用户自己在广告后台
# 实时曲线上看到的经验值，不是本脚本算出来的——先用保守倍率(0.6，降40%不停投)
# 跑一轮，再看效果决定要不要扩大到其它产品/调整时间窗口。

窗口:
  - 名称: "103-周末晚间试验"
    产品码: "103"
    星期: [6, 7]       # 周六、周日
    开始: "21:00"
    结束: "08:00"       # 跨午夜，次日08:00还原原预算
    预算倍率: 0.6
