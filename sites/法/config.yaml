api_base: https://advertising-api-eu.amazon.com
profile_id: 1763296236563585
凭据文件: .ads-credentials.env
管道:
  双写: true
  db_path: data/ads.db
基线文件: baseline.yaml
保护词文件: 保护词.txt
报表:
- 名称: 搜索词
  报告类型: spSearchTerm
  维度: &id001
  - searchTerm
  列: &id002
  - campaignId
  - campaignName
  - adGroupId
  - adGroupName
  - keyword
  - matchType
  - searchTerm
  - impressions
  - clicks
  - cost
  - sales7d
  - purchases7d
  天数: 7
  仅自动广告: true
  归因等待天数: 3
- 名称: 广告活动
  报告类型: spCampaigns
  维度: &id003
  - campaign
  指标: &id004
  - impressions
  - clicks
  - cost
  - sales7d
  - purchases7d
  - campaignBudgetAmount
  - campaignStatus
  天数: 7
  仅自动广告: true
  归因等待天数: 3
- 名称: AUTO投放
  报告类型: spTargeting
  维度: &id005
  - targeting
  列: &id006
  - campaignId
  - campaignName
  - adGroupId
  - adGroupName
  - keywordId
  - keywordBid
  - keywordType
  - adKeywordStatus
  - targeting
  - impressions
  - clicks
  - cost
  - sales7d
  - purchases7d
  过滤器: &id007
  - field: keywordType
    values:
    - TARGETING_EXPRESSION
    - TARGETING_EXPRESSION_PREDEFINED
  天数: 7
  仅自动广告: true
  归因等待天数: 3
- 名称: 搜索词历史
  报告类型: spSearchTerm
  维度: *id001
  列: *id002
  天数: 30
  仅自动广告: false
  归因等待天数: 3
- 名称: 广告活动历史
  报告类型: spCampaigns
  维度: *id003
  指标: *id004
  天数: 14
  仅自动广告: true
  归因等待天数: 3
- 名称: AUTO投放历史
  报告类型: spTargeting
  维度: *id005
  列: *id006
  过滤器: *id007
  天数: 14
  仅自动广告: true
  归因等待天数: 3
